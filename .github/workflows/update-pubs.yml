name: Auto Fetch Publications

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00 自动运行
  workflow_dispatch:      # 支持后台手动一键触发

permissions:
  contents: write         # 允许脚本把新生成的 .md 提交回仓库

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run fetch script
        run: python scripts/fetch_pubs.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/publications/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update publications" && git push)